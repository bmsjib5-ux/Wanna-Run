# ติดตั้ง Edge Function ขึ้น Supabase โดยไม่ต้องลงเครื่องมืออะไรในเครื่องตัวเอง
# กดรันเองได้จากแท็บ Actions และรันให้อัตโนมัติเมื่อโค้ดของฟังก์ชันเปลี่ยน
name: ติดตั้ง Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-function.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: ตรวจว่ามี access token แล้ว
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret ชื่อ SUPABASE_ACCESS_TOKEN — สร้างได้ที่ https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - name: ส่งฟังก์ชัน push ขึ้นเซิร์ฟเวอร์
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # project ref คือส่วนหน้าของ URL โปรเจกต์ (ไม่ใช่ความลับ) เปลี่ยนได้ที่ Actions → Variables
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'tozdnimkbimtgwkyxifa' }}
        run: supabase functions deploy push --project-ref "$PROJECT_REF"

      - name: สรุป
        run: |
          echo "### ติดตั้งฟังก์ชัน push เรียบร้อย ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "ดู log การทำงานจริงได้ที่ Supabase Dashboard → Edge Functions → push → Logs" >> "$GITHUB_STEP_SUMMARY"
