name: สร้าง APK สำหรับ Android

# กดสร้างเองจากแท็บ Actions หรือสร้างอัตโนมัติเมื่อ push แท็ก v* (เช่น v1.0.0)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # สร้างให้อัตโนมัติเมื่อ push branch งาน เพื่อตรวจว่าฝั่ง Android ยัง build ผ่าน
    branches: ['claude/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # เก็บแคชของ Gradle ไว้ รอบถัดไปไม่ต้องโหลดไลบรารีใหม่ทั้งหมด
          cache: gradle

      - name: ติดตั้งแพ็กเกจ
        run: npm ci

      - name: สร้างไฟล์เว็บ
        # คีย์ Supabase ถูกฝังลงในไฟล์ตอน build เหมือนกับเว็บบน Render
        # ถ้าไม่ได้ตั้ง secrets ไว้ แอปจะเปิดในโหมดทดลอง (เก็บข้อมูลในเครื่องอย่างเดียว)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: ซิงก์เข้าโปรเจกต์ Android
        run: npx cap sync android

      - name: ตั้งเลขเวอร์ชันจากหมายเลขรัน
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: เตรียม keystore สำหรับเซ็นแอป (ถ้ามี)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: สร้าง APK แบบเซ็นชื่อ
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          WR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: สร้าง APK แบบ debug (ติดตั้งใช้งานได้ ไม่ต้องมี keystore)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: สรุปว่า APK นี้เชื่อมเซิร์ฟเวอร์หรือเป็นโหมดทดลอง
        # พิมพ์ไว้ท้าย log เพื่อให้เช็คได้ทันทีว่า secrets ติดมาด้วยไหม
        run: |
          echo "── build-info.json ──"
          cat dist/build-info.json
          if grep -q '"cloud": true' dist/build-info.json; then
            echo "::notice::APK นี้เชื่อมกับ Supabase (มีหน้าเข้าสู่ระบบ)"
          else
            echo "::warning::APK นี้เป็นโหมดทดลอง — ยังไม่ได้ตั้ง secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
          fi

      - name: เก็บไฟล์ APK ไว้ให้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: wanna-run-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: แนบ APK ไปกับ Release (เฉพาะตอน push แท็ก)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
