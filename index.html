<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ไปวิ่งไหม — วิ่งด้วยกัน ไปได้ไกลกว่าเดิม</title>
    <meta
      name="description"
      content="ชวนเพื่อนวิ่ง สร้างก๊วน นัดสถานที่ แชร์ตำแหน่งแบบสด จับระยะทางด้วย GPS พร้อมภารกิจและมินิเกม"
    />
    <meta name="theme-color" content="#0b0f14" />
    <script>
      // ตั้งธีมที่ผู้ใช้เลือกไว้ตั้งแต่ก่อนโหลดแอป ไม่งั้นหน้าจะกะพริบจากธีมเริ่มต้นไปธีมที่เลือก
      try {
        var t = JSON.parse(localStorage.getItem('wanna-run.theme') || '{}');
        var bars = { neon: '#05070a', mono: '#fafafa', pastel: '#fdf7f4', glass: '#080e1c', sunset: '#140f0e' };
        if (t.preset && bars[t.preset]) {
          // สไตล์สำเร็จรูปกำหนดสีมาครบชุด จึงไม่ต้องตั้ง data-theme/data-accent
          document.documentElement.dataset.preset = t.preset;
          document.querySelector('meta[name="theme-color"]').content = bars[t.preset];
        } else {
          var mode = t.mode === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (t.mode === 'dark' ? 'dark' : 'light');
          document.documentElement.dataset.theme = mode;
          document.documentElement.dataset.accent = t.accent || 'mint';
          if (mode === 'light') document.querySelector('meta[name="theme-color"]').content = '#f3f6fa';
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ไปวิ่งไหม" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
